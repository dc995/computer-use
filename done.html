<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Done</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #0f7a3d 0%, #0a5e2f 100%);
      color: #fff;
      text-align: center;
      overflow: hidden;
    }
    .check {
      font-size: 14vw;
      line-height: 1;
      animation: pop 0.5s ease-out;
    }
    h1 {
      font-size: 11vw;
      margin: 0.1em 0 0;
      letter-spacing: 0.02em;
      animation: pop 0.6s ease-out;
    }
    p {
      font-size: 2.2vw;
      opacity: 0.85;
      margin-top: 1em;
    }
    @keyframes pop {
      0%   { transform: scale(0.4); opacity: 0; }
      70%  { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="check">✅</div>
  <h1>I&rsquo;M DONE</h1>
  <p id="detail">The computer-use run has finished.</p>
  <script>
    // Optional detail passed via ?msg=... (e.g. which run finished).
    const msg = new URLSearchParams(location.search).get("msg");
    if (msg) document.getElementById("detail").textContent = msg;
  </script>
</body>
</html>
